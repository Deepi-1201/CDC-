<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Placement Portal - CDC L&D</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2433;--mut:#66708a;--line:#dde1ea;--ac:#0f6b62;--red:#b42318;--redbg:#fde8e6;--amb:#8a5a00;--ambbg:#fff2cc;--grn:#0b6b3a;--grnbg:#dff5e8}
@media (prefers-color-scheme:dark){:root{--bg:#12161f;--card:#1a2030;--ink:#e8ebf2;--mut:#98a2bd;--line:#2c3550;--ac:#4cc2b4;--red:#ff9c92;--redbg:#41201d;--amb:#ffd166;--ambbg:#3d3115;--grn:#7ee0a5;--grnbg:#153726}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
header{padding:16px 22px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:12px}
header div{flex:1}header h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
nav{display:flex;gap:4px;padding:10px 22px 0;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;color:var(--mut);font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--ac);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:20px 22px 60px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
input,select,button.b{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button.b{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer;font-weight:500}button.g{background:none;color:var(--ink);border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tw{overflow-x:auto;max-height:70vh}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:500;background:var(--card);position:sticky;top:0}
th.c,td.c{text-align:center}th.gh{text-align:center;color:var(--ink);font-weight:600;border-left:2px solid var(--line)}td.sep{border-left:2px solid var(--line)}
.t{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.P{background:var(--grnbg);color:var(--grn)}.A{background:var(--redbg);color:var(--red)}.E{background:var(--ambbg);color:var(--amb)}.N{color:var(--mut)}
.hl{background:var(--ambbg)}h2{font-size:17px;margin:0 0 10px}.m{color:var(--mut);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kv b{display:block;font-size:12px;color:var(--mut);font-weight:500}
</style></head><body>
<header><div><h1>Placement Portal</h1><p>PSG College of Arts &amp; Science - Career Development Center, Learning &amp; Development</p></div><button class="b g" id="lo" style="display:none" onclick="sb.auth.signOut().then(()=>location.reload())">Log out</button></header>
<nav id="nav"></nav><main id="v"></main>
<script>
// 1. Paste your Supabase project values here (Project Settings > API)
const SB_URL='PASTE_YOUR_SUPABASE_URL', SB_KEY='PASTE_YOUR_SUPABASE_ANON_KEY';
const SETUP=SB_URL.startsWith('PASTE')||SB_KEY.startsWith('PASTE'),NOLIB=typeof supabase==='undefined';
const sb=(SETUP||NOLIB)?null:supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs=['Student lookup','CST / CSA report','Upload data','Companies'];let tab=0,cur='',C={},rc='',rk='BOTH',rf='ALL',rm=false,M=null;
const NIL='<span class="N">-</span>',cn2=c=>C[c]?c+' - '+C[c].name:c;
const tag=x=>!x?NIL:x.status==='P'?'<span class="t P">P</span>':`<span class="t ${x.exempt?'E':'A'}"${x.exempt?` title="${esc(x.exempt)}"`:''}>A</span>`;
async function all(q){let o=[],f=0;for(;;){const{data,error}=await q().range(f,f+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;f+=1000}return o}
async function put(t,a,o){for(let i=0;i<a.length;i+=500){const{error}=await sb.from(t).upsert(a.slice(i,i+500),o||{});if(error)throw error}}
async function loadC(){C=Object.fromEntries((await all(()=>sb.from('companies').select('*'))).map(x=>[x.code,x]))}
async function init(){const{data}=await sb.auth.getSession();if(!data.session){$('nav').innerHTML='';$('v').innerHTML=`<div class="box" style="max-width:360px;margin:40px auto"><h2>Log in</h2><div class="row"><input id="em" placeholder="Email" style="width:100%"></div><div class="row"><input id="pw" type="password" placeholder="Password" style="width:100%" onkeydown="if(event.key=='Enter')login()"></div><button class="b" onclick="login()">Log in</button><div id="le" class="m"></div></div>`;return}
 $('lo').style.display='';await loadC();draw()}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('le').textContent=error.message;else init()}
async function draw(){$('nav').innerHTML=tabs.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};draw()">${t}</button>`).join('');
 $('v').innerHTML='<div class="box m">Loading...</div>';try{$('v').innerHTML=await[lookup,report,upload,comp][tab]()}catch(e){$('v').innerHTML=`<div class="box"><span class="t A">Error</span> ${esc(e.message||e)}</div>`}}
/* ---------- Student lookup ---------- */
function go(){cur=$('q').value.trim().toUpperCase();draw()}
async function lookup(){
 let h=`<div class="box"><div class="row"><input id="q" placeholder="Enter roll number, e.g. 22MSS001" value="${esc(cur)}" onkeydown="if(event.key=='Enter')go()"><button class="b" onclick="go()">Search</button></div></div>`;if(!cur)return h;
 const[s,rs,p,d,rd]=await Promise.all([sb.from('students').select('*').eq('roll',cur).maybeSingle(),all(()=>sb.from('records').select('*').eq('roll',cur).order('ord')),sb.from('placed').select('*').eq('roll',cur).maybeSingle(),sb.from('delisted').select('roll').eq('roll',cur).maybeSingle(),sb.from('rounds').select('*').eq('roll',cur)]);
 if(!s.data)return h+`<div class="box">No student found for ${esc(cur)}. Upload a file that contains this student first.</div>`;
 const B={},T={},RD=Object.fromEntries((rd.data||[]).map(x=>[x.code,x.round_text]));
 rs.forEach(x=>{if(x.code==='-')T[x.kind]=x;else(B[x.code]=B[x.code]||{CST:[],CSA:[]})[x.kind]?.push(x)});
 const cs=Object.keys(B),nC=Math.max(1,...cs.map(c=>B[c].CST.length)),nA=Math.max(1,...cs.map(c=>B[c].CSA.length)),pl=p.data,blk=pl&&C[pl.code]&&C[pl.code].type==='Core';
 const hd=(n,l)=>Array.from({length:n},(_,i)=>`<th class="c">${l} ${i+1}</th>`).join(''),cl=(a,n)=>Array.from({length:n},(_,i)=>`<td class="c">${tag(a[i])}</td>`).join('');
 h+=`<div class="box"><h2>${esc(s.data.name||'Name not found in uploaded file')}</h2><div class="kv"><div><b>Roll number</b>${esc(cur)}</div><div><b>Department</b>${esc(s.data.dept||'-')}</div><div><b>Companies attended</b>${cs.length}</div><div><b>Placement status</b>${pl?`<span class="t P">Placed</span> ${esc(cn2(pl.code))}${pl.salary?' - '+esc(pl.salary):''}`:'<span class="t N">Not placed</span>'}</div><div><b>Delisted by Placement Office</b>${d.data?'<span class="t A">Yes - removed</span>':'<span class="t P">No</span>'}</div>${blk?'<div><b>Drive access</b><span class="t A">Blocked (core placed)</span></div>':''}</div></div>`;
 h+=`<div class="box"><h2>CST / CSA record</h2><div class="tw"><table><tr><th>Company</th><th>Type</th>${hd(nC,'CST')}${hd(nA,'CSA')}<th>Rounds reached</th><th>Exemption reason</th></tr>`+(cs.map(c=>{const xs=[...B[c].CST,...B[c].CSA].filter(x=>x.exempt).map(x=>x.kind+' - '+x.label+': '+x.exempt).join('; ');
  return `<tr class="${xs?'hl':''}"><td>${esc(cn2(c))}</td><td>${esc(C[c]?.type||'')}</td>${cl(B[c].CST,nC)}${cl(B[c].CSA,nA)}<td>${esc(RD[c]||'-')}</td><td>${esc(xs)}</td></tr>`}).join('')||`<tr><td colspan=${4+nC+nA} class="N">No company records yet.</td></tr>`)+`</table></div></div>`;
 const mk=[];cs.forEach(c=>B[c].CSA.forEach(x=>x.marks&&mk.push(`<tr><td>${esc(cn2(c))}</td><td>${esc(x.label)}</td><td>${x.marks.c.map(k=>esc(k[0])+' '+k[1]+(k[2]?'/'+k[2]:'')).join(', ')}</td><td><b>${x.marks.t}${x.marks.tm?'/'+x.marks.tm:''}</b></td></tr>`)));
 if(mk.length)h+=`<div class="box"><h2>CSA marks</h2><div class="tw"><table><tr><th>Company</th><th>Assessment</th><th>Category marks</th><th>Total</th></tr>${mk.join('')}</table></div></div>`;
 h+=`<div class="box"><h2>Other training</h2><div class="kv">`+[['COMM','Communication training'],['EXCEL','Excel training']].map(([k,l])=>`<div><b>${l}</b>${T[k]?tag(T[k]):'<span class="N">Not selected</span>'}</div>`).join('')+`</div></div>`;
 const ab=rs.filter(x=>x.status==='A');
 h+=`<div class="box"><h2>Exemption and rounds</h2><div class="row"><select id="xi">${ab.map(x=>`<option value="${x.id}">${esc((x.code==='-'?'':x.code+' ')+x.kind+' - '+x.label)}</option>`).join('')||'<option value="">No absences</option>'}</select><input id="xr" placeholder="Reason (medical, emergency, miscellaneous)" size="32"><button class="b" onclick="ex()">Save exemption</button></div>
 <div class="row"><select id="rcode">${cs.map(c=>`<option>${c}</option>`).join('')}</select><input id="rt" placeholder="Round reached, e.g. Round 2 (Technical)" size="32"><button class="b g" onclick="setRound()">Save round</button></div></div>`;return h}
async function ex(){const id=$('xi').value,r=$('xr').value.trim();if(!id||!r){alert('Pick an absence and enter a reason.');return}const{error}=await sb.from('records').update({exempt:r}).eq('id',id);if(error)alert(error.message);draw()}
async function setRound(){const c=$('rcode').value,t=$('rt').value.trim();if(!c||!t)return;const{error}=await sb.from('rounds').upsert({roll:cur,code:c,round_text:t});if(error)alert(error.message);draw()}
/* ---------- CST / CSA report: company heading, P/A columns, adjusts to the Excel ---------- */
async function report(){
 const codes=Object.keys(C).sort();if(!rc&&codes.length)rc=codes[0];const o=(v,l,c)=>`<option value="${v}" ${c===v?'selected':''}>${esc(l)}</option>`;
 const rs=await all(()=>{let q=sb.from('records').select('roll,code,kind,ord,label,status,marks,exempt').in('kind',rk==='BOTH'?['CST','CSA']:[rk]).order('ord');return rc==='ALL'?q:q.eq('code',rc)});
 const[stu,dl]=await Promise.all([all(()=>sb.from('students').select('roll,name')),all(()=>sb.from('delisted').select('roll'))]);
 const nm=Object.fromEntries(stu.map(x=>[x.roll,x.name])),ds=new Set(dl.map(x=>x.roll)),cols=[],seen={},cell={},rl=new Set();
 rs.forEach(x=>{const k=x.code+'|'+x.kind+'|'+x.ord;if(!seen[k]){seen[k]=1;cols.push({code:x.code,kind:x.kind,ord:x.ord,label:x.label,k})}cell[x.roll+'|'+k]=x;rl.add(x.roll)});
 const ko=k=>k==='CST'?0:1;cols.sort((a,b)=>a.code.localeCompare(b.code)||ko(a.kind)-ko(b.kind)||a.ord-b.ord);
 const cnt={};cols.forEach(c=>{const g=c.code+c.kind;cnt[g]=(cnt[g]||0)+1;c.title=c.kind+' '+cnt[g]});
 let R=[...rl].sort();if(rf==='ABS')R=R.filter(r=>cols.some(c=>cell[r+'|'+c.k]?.status==='A'));M={cols,R,cell,nm};
 const grp=[];cols.forEach(c=>{const g=grp[grp.length-1];if(g&&g.code===c.code)g.n++;else grp.push({code:c.code,n:1})});
 const cv=(r,c)=>{const x=cell[r+'|'+c.k];return rm&&c.kind==='CSA'&&x?.marks?`<b>${x.marks.t}</b>`:tag(x)};
 let P=0,A=0;rs.forEach(x=>x.status==='P'?P++:A++);
 return `<div class="box"><div class="row"><h2 style="margin:0;flex:1">CST / CSA report</h2><button class="b g" onclick="csv()">Download CSV</button></div>
 <div class="row"><select onchange="rc=this.value;draw()">${o('ALL','All companies',rc)}${codes.map(c=>o(c,cn2(c),rc)).join('')}</select>
 <select onchange="rk=this.value;draw()">${o('BOTH','CST + CSA',rk)}${o('CST','CST only',rk)}${o('CSA','CSA only',rk)}</select>
 <select onchange="rf=this.value;draw()">${o('ALL','All students',rf)}${o('ABS','Only students with an A',rf)}</select>
 <label class="m"><input type="checkbox" ${rm?'checked':''} onchange="rm=this.checked;draw()"> Show CSA marks instead of P/A</label></div>
 <div class="m" style="margin-bottom:8px">${R.length} students | P: ${P} | A: ${A}. Amber A = approved exemption (hover for reason). The columns follow the Excel you uploaded for each company.</div>
 <div class="tw"><table><tr><th rowspan=2>Roll number</th><th rowspan=2>Name</th>${grp.map(g=>`<th class="gh" colspan=${g.n}>${esc(cn2(g.code))}</th>`).join('')}</tr><tr>${cols.map((c,i)=>`<th class="c ${i&&cols[i-1].code!==c.code?'sep':''}" title="${esc(c.label)}">${c.title}</th>`).join('')}</tr>`+
 (R.map(r=>`<tr><td>${esc(r)}</td><td>${esc(nm[r]||'')}${ds.has(r)?' <span class="t A">Delisted</span>':''}</td>${cols.map((c,i)=>`<td class="c ${i&&cols[i-1].code!==c.code?'sep':''}">${cv(r,c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=3 class="N">No records. Upload CST / CSA files first.</td></tr>`)+`</table></div></div>`}
function csv(){const{cols,R,cell,nm}=M,L=[['Roll number','Name',...cols.map(c=>cn2(c.code)+' '+c.title)],...R.map(r=>[r,nm[r]||'',...cols.map(c=>{const x=cell[r+'|'+c.k];return !x?'':rm&&c.kind==='CSA'&&x.marks?x.marks.t:x.status})])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download='cst_csa_report.csv';a.click()}
/* ---------- Upload ---------- */
function upload(){return `<div class="box"><h2>Upload an Excel file</h2><div class="row"><select id="ut"><option value="CST">CST attendance (all sheets of one company)</option><option value="CSA">CSA attendance / marks</option><option value="COMM">Communication training</option><option value="EXCEL">Excel training</option><option value="DEL">Delisted list (Placement Office)</option><option value="PLC">Placed list (Placement Office)</option></select><select id="uc">${Object.keys(C).sort().map(c=>`<option value="${c}">${esc(cn2(c))}</option>`).join('')}</select><input type="file" id="uf" accept=".xlsx,.xls,.csv"><button class="b" onclick="doUp()">Upload</button></div>
<div class="m">Every session column with P/A (physical) becomes CST 1, CST 2... in the order of the sheet, and a column marked "(CSA)" is stored as CSA. A virtual sheet (minutes) becomes one more CST, present if minutes are at least half of the session duration. CSA files with marks: each assessment (Practice 01, 02...) becomes a CSA column with its category marks. Uploading again for the same company replaces its earlier CST/CSA data. Company is needed for CST, CSA and Placed list.</div><div id="um" style="margin-top:10px"></div></div>`}
const RX=/(\d{2}[A-Z]{2,4}\d{2,3})/i,isR=v=>/^\d{2}[A-Z]{2,4}\d{2,3}$/i.test(String(v).trim());
function colsOf(rows,d,i,row){const h2=rows[d-1]||[],h1=rows[d-2]||[];let g='';const out=[];for(let j=i+1;j<row.length;j++){if(String(h1[j]||'').trim())g=String(h1[j]).trim();const c=String(h2[j]||'').trim(),v=row[j];
 if(!c||/duration|email|time/i.test(c)||(v!==''&&isNaN(v)))continue;out.push({j,g:g||'Assessment 1',c,tot:/total/i.test(c),mx:(c.match(/\((\d+)\)/)||[])[1]||''})}return out}
function build(cl,row){const gs=[];cl.forEach(o=>{let a=gs.find(x=>x.a===o.g);if(!a){a={a:o.g,c:[],t:null,tm:'',has:0};gs.push(a)}const v=row[o.j];if(v==='')return;a.has=1;const n=Number(v);if(o.tot){a.t=n;a.tm=o.mx}else a.c.push([o.c.replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim(),n,o.mx])});
 gs.forEach(a=>{if(a.t===null){a.t=a.c.reduce((z,k)=>z+k[1],0);a.tm=a.c.length&&a.c.every(k=>k[2])?a.c.reduce((z,k)=>z+ +k[2],0):''}});return gs}
async function doUp(){
 const f=$('uf').files[0],t=$('ut').value,code=$('uc').value||'-',o=$('um');if(!f){o.textContent='Choose a file first.';return}
 try{o.textContent='Reading file...';const wb=XLSX.read(await f.arrayBuffer()),S={},RC={},DL=new Set(),PL=new Map(),cnt={CST:0,CSA:0,COMM:0,EXCEL:0},cd=(t==='COMM'||t==='EXCEL')?'-':code;
 const add=(r,kind,ord,label,status,marks)=>{RC[r+kind+ord]={roll:r,code:cd,kind,ord,label,status,marks:marks||null,exempt:null}};
 wb.SheetNames.forEach(sn=>{if(/log|improper/i.test(sn))return;const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false}),data=[];let dur=0;
  rows.forEach((row,ri)=>{const k=row.findIndex(v=>/session duration/i.test(String(v)));if(k>=0)dur=Number(row.slice(k+1).find(v=>v!==''&&!isNaN(v)))||0;const i=row.findIndex(isR);if(i>=0)data.push({row,ri,i,r:String(row[i]).trim().toUpperCase()})});
  if(!data.length)return;const d0=data[0];
  data.forEach(({row,i,r})=>{const st=row.filter((v,j)=>j!==i&&v&&isNaN(v)&&!/^[PA]$/i.test(String(v).trim())&&!/@/.test(v)).map(v=>String(v).trim().toUpperCase());S[r]={roll:r,name:st[0]||null,dept:st[1]||null}});
  if(t==='DEL'){data.forEach(x=>DL.add(x.r));return}if(t==='PLC'){data.forEach(x=>PL.set(x.r,{roll:x.r,code}));return}
  const cl=t==='CSA'?colsOf(rows,d0.ri,d0.i,d0.row):[];
  if(cl.length){const gn=[...new Set(cl.map(x=>x.g))];data.forEach(({row,r})=>build(cl,row).forEach((a,gi)=>add(r,'CSA',cnt.CSA+gi+1,a.a,a.has?'P':'A',a.has?{c:a.c,t:a.t,tm:a.tm}:null)));cnt.CSA+=gn.length;return}
  const h2=rows[d0.ri-1]||[],h1=rows[d0.ri-2]||[];let g='';const ff=h1.map(v=>(String(v).trim()?g=String(v).trim():g)),J=[];
  for(let j=d0.i+1;j<d0.row.length+8;j++)if(data.some(x=>/^[PA]$/i.test(String(x.row[j]||'').trim())))J.push(j);
  if(J.length)J.forEach(j=>{const lb=[...new Set([ff[j],String(h2[j]||'').trim()].filter(Boolean))].join(' ').replace(/\s+/g,' ')||('Session '+j),kind=t==='CST'&&/csa/i.test(lb)?'CSA':t,n=++cnt[kind];data.forEach(({row,r})=>{const v=String(row[j]||'').trim();if(v)add(r,kind,n,lb,/p/i.test(v)?'P':'A')})});
  else{const n=++cnt[t];data.forEach(({row,i,r})=>{const nu=row.slice(i+1).filter(v=>v!==''&&!isNaN(v));add(r,t,n,sn+(dur?' ('+dur+' min)':''),nu.length&&Number(nu[nu.length-1])>=(dur?dur/2:1)?'P':'A')})}});
 const rl=Object.values(RC),ss=Object.values(S);o.textContent='Saving to database...';
 await put('students',ss.filter(x=>x.name),{onConflict:'roll'});await put('students',ss.filter(x=>!x.name).map(x=>({roll:x.roll})),{onConflict:'roll',ignoreDuplicates:true});
 if(t==='DEL')await put('delisted',[...DL].map(roll=>({roll})),{onConflict:'roll'});
 else if(t==='PLC')await put('placed',[...PL.values()],{onConflict:'roll'});
 else{for(const k of new Set(rl.map(x=>x.kind))){let q=sb.from('records').delete().eq('kind',k).eq('code',cd);const{error}=await q;if(error)throw error}await put('records',rl,{onConflict:'roll,code,kind,ord'})}
 o.innerHTML=`<span class="t P">Saved</span> ${ss.length} students, ${rl.length} attendance/marks entries.`}
 catch(e){o.innerHTML=`<span class="t A">Failed</span> ${esc(e.message||e)}`}}
/* ---------- Companies ---------- */
async function comp(){await loadC();return `<div class="box"><h2>Companies</h2><div class="row"><input id="cc" placeholder="Code e.g. 26CST004" size="16"><input id="cnm" placeholder="Company name"><select id="ct"><option>Core</option><option>Non-core</option><option>Super Dream</option></select><button class="b" onclick="addC()">Add company</button></div><div class="tw"><table><tr><th>Code</th><th>Company</th><th>Type</th></tr>`+Object.values(C).sort((a,b)=>a.code.localeCompare(b.code)).map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.type)}</td></tr>`).join('')+`</table></div></div>`}
async function addC(){const k=$('cc').value.trim().toUpperCase(),n=$('cnm').value.trim();if(!k||!n){alert('Enter code and name.');return}const{error}=await sb.from('companies').upsert({code:k,name:n,type:$('ct').value});if(error)alert(error.message);draw()}
function setup(){document.getElementById('v').innerHTML=NOLIB?'<div class="box"><h2>Cannot load required libraries</h2><p>Check the internet connection and refresh the page.</p></div>':'<div class="box"><h2>Almost ready - connect the database</h2><p>The page is working, but it is not connected to Supabase yet.</p><ol><li>Open <b>index.html</b> in a text editor (or the pencil icon on GitHub).</li><li>Find the two lines near the top of the script: <code>SB_URL</code> and <code>SB_KEY</code>.</li><li>Replace the text inside the quotes with your Supabase <b>Project URL</b> and <b>anon public key</b> (Supabase > Project Settings > API).</li><li>Save, refresh this page, and log in.</li></ol></div>'}
(SETUP||NOLIB)?setup():init();
