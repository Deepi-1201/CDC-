<style>

<header><div><h1>Placement Portal</h1><p>PSG College of Arts &amp; Science - Career Development Center, Learning &amp; Development</p></div><span class="m" id="me"></span><button class="b g" id="lo" style="display:none" onclick="sb.auth.signOut().then(()=>location.reload())">Log out</button></header>

<script>
// 1. Paste your Supabase project values here (Project Settings > API)
const SB_URL='https://xmizrzklldnpntunotmk.supabase.co', SB_KEY='sb_publishable_Gi69nsw31vTFq1A2YziPkA_MneDgFB-';
const SETUP=SB_URL.startsWith('PASTE')||SB_KEY.startsWith('PASTE'),NOLIB=typeof supabase==='undefined';
// 2. Optional: paste your Google Sheet link here once, so the portal offers to sync every time an admin logs in
const GSHEET_URL='';
const sb=(SETUP||NOLIB)?null:supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs=['Student lookup','CST / CSA report','Upload data','Companies','Users'];let ROLE='',EMAIL='',tab=0,cur='',C={},rc='',rk='BOTH',rf='ALL',rm=false,M=null;
const NIL='<span class="N">-</span>',cn2=c=>C[c]?c+' - '+C[c].name:c;
const tag=x=>!x?NIL:x.status==='P'?'<span class="t P">P</span>':`<span class="t ${x.exempt?'E':'A'}"${x.exempt?` title="${esc(x.exempt)}"`:''}>A</span>`;
async function all(q){let o=[],f=0;for(;;){const{data,error}=await q().range(f,f+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;f+=1000}return o}

async function init(){const{data}=await sb.auth.getSession();if(!data.session){$('nav').innerHTML='';$('v').innerHTML=`<div class="box" style="max-width:360px;margin:40px auto"><h2>Log in</h2><div class="row"><input id="em" placeholder="Email" style="width:100%"></div><div class="row"><input id="pw" type="password" placeholder="Password" style="width:100%" onkeydown="if(event.key=='Enter')login()"></div><button class="b" onclick="login()">Log in</button><div id="le" class="m"></div></div>`;return}
 EMAIL=(data.session.user.email||'').toLowerCase();$('lo').style.display='';
 const{data:st}=await sb.from('staff').select('role').eq('email',EMAIL).maybeSingle();ROLE=st?.role||'';$('me').textContent=EMAIL+(ROLE?' ('+ROLE+')':'');
 if(!ROLE){$('nav').innerHTML='';$('v').innerHTML='<div class="box"><h2>No access</h2><p>You are logged in as '+esc(EMAIL)+', but this email has not been given access yet. Please ask the admin to add it.</p></div>';return}
 await loadC();draw();if(ROLE==='admin')autoSync()}
async function autoSync(){let u=GSHEET_URL;try{u=u||localStorage.getItem('cdc_gs')||''}catch(e){}if(!u)return;if(!confirm('Sync companies, rounds and sessions from the Google Sheet now?'))return;tab=2;await draw();$('gu').value=u;await syncG()}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('le').textContent=error.message;else init()}
async function draw(){$('nav').innerHTML=(ROLE==='admin'?tabs:tabs.slice(0,2)).map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};draw()">${t}</button>`).join('');
 $('v').innerHTML='<div class="box m">Loading...</div>';try{$('v').innerHTML=await[lookup,report,upload,comp,users][tab]();initAuto()}catch(e){$('v').innerHTML=`<div class="box"><span class="t A">Error</span> ${esc(e.message||e)}</div>`}}
/* ---------- Student lookup ---------- */
function go(){cur=$('q').value.trim().toUpperCase();draw()}
async function lookup(){
 let h=`<div class="box"><div class="row"><input id="q" placeholder="Enter roll number, e.g. 22MSS001" value="${esc(cur)}" onkeydown="if(event.key=='Enter')go()"><button class="b" onclick="go()">Search</button></div></div>`;if(!cur)return h;
 const[s,rs,p,d,rd]=await Promise.all([sb.from('students').select('*').eq('roll',cur).maybeSingle(),all(()=>sb.from('records').select('*').eq('roll',cur).order('ord')),sb.from('placed').select('*').eq('roll',cur).maybeSingle(),sb.from('delisted').select('roll').eq('roll',cur).maybeSingle(),sb.from('rounds').select('*').eq('roll',cur)]);
 if(!s.data)return h+`<div class="box">No student found for ${esc(cur)}. Upload a file that contains this student first.</div>`;
 const B={},T={},RD=Object.fromEntries((rd.data||[]).map(x=>[x.code,x.round_text]));
 rs.forEach(x=>{if(x.code==='-')T[x.kind]=x;else(B[x.code]=B[x.code]||{CST:[],CSA:[]})[x.kind]?.push(x)});
 const cs=Object.keys(B),nC=Math.max(1,...cs.map(c=>B[c].CST.length)),nA=Math.max(1,...cs.map(c=>B[c].CSA.length)),pl=p.data,blk=pl&&C[pl.code]&&C[pl.code].type==='Core';
 const hd=(n,l)=>Array.from({length:n},(_,i)=>`<th class="c">${l} ${i+1}</th>`).join(''),cl=(a,n)=>Array.from({length:n},(_,i)=>`<td class="c">${tag(a[i])}</td>`).join('');
 h+=`<div class="box"><h2>${esc(s.data.name||'Name not found in uploaded file')}</h2><div class="kv"><div><b>Roll number</b>${esc(cur)}</div><div><b>Department</b>${esc(s.data.dept||'-')}</div><div><b>Companies attended</b>${cs.length}</div><div><b>Placement status</b>${pl?`<span class="t P">Placed</span> ${esc(cn2(pl.code))}${pl.salary?' - '+esc(pl.salary):''}`:'<span class="t N">Not placed</span>'}</div><div><b>Delisted by Placement Office</b>${d.data?'<span class="t A">Yes - removed</span>':'<span class="t P">No</span>'}</div>${blk?'<div><b>Drive access</b><span class="t A">Blocked (core placed)</span></div>':''}</div></div>`;
 h+=`<div class="box"><h2>CST / CSA record</h2><div class="tw"><table><tr><th>Company</th><th>Type</th>${hd(nC,'CST')}${hd(nA,'CSA')}<th>Rounds reached</th><th>Exemption reason</th></tr>`+(cs.map(c=>{const xs=[...B[c].CST,...B[c].CSA].filter(x=>x.exempt).map(x=>x.kind+' - '+x.label+': '+x.exempt).join('; ');
  return `<tr class="${xs?'hl':''}"><td>${esc(cn2(c))}</td><td>${esc(C[c]?.type||'')}</td>${cl(B[c].CST,nC)}${cl(B[c].CSA,nA)}<td>${esc(RD[c]||'-')}</td><td>${esc(xs)}</td></tr>`}).join('')||`<tr><td colspan=${4+nC+nA} class="N">No company records yet.</td></tr>`)+`</table></div></div>`;
 const dt=[];cs.forEach(c=>[...B[c].CST,...B[c].CSA].forEach(x=>dt.push(`<tr class="${x.exempt?'hl':''}"><td>${esc(cn2(c))}</td><td>${esc(C[c]?.type||'')}</td><td>${x.kind}</td><td>${esc(x.label)}</td><td class="c">${tag(x)}</td><td>${x.marks?'<b>'+x.marks.t+(x.marks.tm?'/'+x.marks.tm:'')+'</b>':''}</td><td>${esc(x.exempt||'')}</td></tr>`)));
 if(dt.length)h+=`<div class="box"><h2>Attendance and assessment details</h2><div class="tw"><table><tr><th>Company</th><th>Type</th><th>CST / CSA</th><th>Session / assessment</th><th>Status</th><th>CSA total</th><th>Exemption reason</th></tr>${dt.join('')}</table></div></div>`;
 const mk=[];cs.forEach(c=>B[c].CSA.forEach(x=>x.marks&&mk.push(`<tr><td>${esc(cn2(c))}</td><td>${esc(x.label)}</td><td>${x.marks.c.map(k=>esc(k[0])+' '+k[1]+(k[2]?'/'+k[2]:'')).join(', ')}</td><td><b>${x.marks.t}${x.marks.tm?'/'+x.marks.tm:''}</b></td></tr>`)));
 if(mk.length)h+=`<div class="box"><h2>CSA marks</h2><div class="tw"><table><tr><th>Company</th><th>Assessment</th><th>Category marks</th><th>Total</th></tr>${mk.join('')}</table></div></div>`;
 h+=`<div class="box"><h2>Other training</h2><div class="kv">`+[['COMM','Communication training'],['EXCEL','Excel training']].map(([k,l])=>`<div><b>${l}</b>${T[k]?tag(T[k]):'<span class="N">Not selected</span>'}</div>`).join('')+`</div></div>`;
 if(ROLE==='admin'){const ab=rs.filter(x=>x.status==='A');
 h+=`<div class="box"><h2>Exemption and rounds</h2><div class="row"><select id="xi">${ab.map(x=>`<option value="${x.id}">${esc((x.code==='-'?'':x.code+' ')+x.kind+' - '+x.label)}</option>`).join('')||'<option value="">No absences</option>'}</select><input id="xr" placeholder="Reason (medical, emergency, miscellaneous)" size="32"><button class="b" onclick="ex()">Save exemption</button></div>
 <div class="row"><select id="rcode">${cs.map(c=>`<option>${c}</option>`).join('')}</select><input id="rt" placeholder="Round reached, e.g. Round 2 (Technical)" size="32"><button class="b g" onclick="setRound()">Save round</button></div></div>`;}
 return h}
async function ex(){const id=$('xi').value,r=$('xr').value.trim();if(!id||!r){alert('Pick an absence and enter a reason.');return}const{error}=await sb.from('records').update({exempt:r}).eq('id',id);if(error)alert(error.message);draw()}
async function setRound(){const c=$('rcode').value,t=$('rt').value.trim();if(!c||!t)return;const{error}=await sb.from('rounds').upsert({roll:cur,code:c,round_text:t});if(error)alert(error.message);draw()}
/* ---------- CST / CSA report: company heading, P/A columns, adjusts to the Excel ---------- */
async function report(){
 const codes=Object.keys(C).sort();if(!rc&&codes.length)rc=codes[0];const o=(v,l,c)=>`<option value="${v}" ${c===v?'selected':''}>${esc(l)}</option>`;
 const rs=await all(()=>{let q=sb.from('records').select('roll,code,kind,ord,label,status,marks,exempt').in('kind',rk==='BOTH'?['CST','CSA']:[rk]).order('ord');return rc==='ALL'?q:q.eq('code',rc)});
 const[stu,dl]=await Promise.all([all(()=>sb.from('students').select('roll,name')),all(()=>sb.from('delisted').select('roll'))]);
 const nm=Object.fromEntries(stu.map(x=>[x.roll,x.name])),ds=new Set(dl.map(x=>x.roll)),cols=[],seen={},cell={},rl=new Set();
 rs.forEach(x=>{const k=x.code+'|'+x.kind+'|'+x.ord;if(!seen[k]){seen[k]=1;cols.push({code:x.code,kind:x.kind,ord:x.ord,label:x.label,k})}cell[x.roll+'|'+k]=x;rl.add(x.roll)});
 const ko=k=>k==='CST'?0:1;cols.sort((a,b)=>a.code.localeCompare(b.code)||ko(a.kind)-ko(b.kind)||a.ord-b.ord);
 const cnt={};cols.forEach(c=>{const g=c.code+c.kind;cnt[g]=(cnt[g]||0)+1;c.title=c.kind+' '+cnt[g]});
 let R=[...rl].sort();if(rf==='ABS')R=R.filter(r=>cols.some(c=>cell[r+'|'+c.k]?.status==='A'));M={cols,R,cell,nm};
 const grp=[];cols.forEach(c=>{const g=grp[grp.length-1];if(g&&g.code===c.code)g.n++;else grp.push({code:c.code,n:1})});
 const cv=(r,c)=>{const x=cell[r+'|'+c.k];return rm&&c.kind==='CSA'&&x?.marks?`<b>${x.marks.t}</b>`:tag(x)};
 let P=0,A=0;rs.forEach(x=>x.status==='P'?P++:A++);
 return `<div class="box"><div class="row"><h2 style="margin:0;flex:1">CST / CSA report</h2>${ROLE==='admin'?'<button class="b g" onclick="csv()">Download CSV</button>':''}</div>
 <div class="row"><select onchange="rc=this.value;draw()">${o('ALL','All companies',rc)}${codes.map(c=>o(c,cn2(c),rc)).join('')}</select>
 <select onchange="rk=this.value;draw()">${o('BOTH','CST + CSA',rk)}${o('CST','CST only',rk)}${o('CSA','CSA only',rk)}</select>
 <select onchange="rf=this.value;draw()">${o('ALL','All students',rf)}${o('ABS','Only students with an A',rf)}</select>
 <label class="m"><input type="checkbox" ${rm?'checked':''} onchange="rm=this.checked;draw()"> Show CSA marks instead of P/A</label></div>
 <div class="m" style="margin-bottom:8px">${R.length} students | P: ${P} | A: ${A}. Amber A = approved exemption (hover for reason). The columns follow the Excel you uploaded for each company.</div>
 <div class="tw"><table><tr><th rowspan=2>Roll number</th><th rowspan=2>Name</th>${grp.map(g=>`<th class="gh" colspan=${g.n}>${esc(cn2(g.code))}</th>`).join('')}</tr><tr>${cols.map((c,i)=>`<th class="c ${i&&cols[i-1].code!==c.code?'sep':''}" title="${esc(c.label)}">${c.title}</th>`).join('')}</tr>`+
 (R.map(r=>`<tr><td>${esc(r)}</td><td>${esc(nm[r]||'')}${ds.has(r)?' <span class="t A">Delisted</span>':''}</td>${cols.map((c,i)=>`<td class="c ${i&&cols[i-1].code!==c.code?'sep':''}">${cv(r,c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=3 class="N">No records. Upload CST / CSA files first.</td></tr>`)+`</table></div></div>`}
function csv(){const{cols,R,cell,nm}=M,L=[['Roll number','Name',...cols.map(c=>cn2(c.code)+' '+c.title)],...R.map(r=>[r,nm[r]||'',...cols.map(c=>{const x=cell[r+'|'+c.k];return !x?'':rm&&c.kind==='CSA'&&x.marks?x.marks.t:x.status})])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download='cst_csa_report.csv';a.click()}
/* ---------- Upload ---------- */
const nz=v=>String(v??'').replace(/\s+/g,' ').trim(),key=v=>nz(v).toLowerCase().replace(/[^a-z0-9]/g,''),w2r=(wb,n)=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false});
function matchC(fn){const k=key(fn);let b='',l=0,amb=false;Object.values(C).forEach(c=>{const n=key(c.name);if(n.length>2&&k.includes(n)){if(n.length>l){b=c.code;l=n.length;amb=false}else if(n.length===l&&c.code!==b)amb=true}});return amb?'':b}
let LBL=null;
async function loadL(){const r=await all(()=>sb.from('sessions').select('code,att_link,csa_link,att_label,csa_label').order('id')),m=new Map();
 r.forEach(z=>[['CST',z.att_link,z.att_label],['CSA',z.csa_link,z.csa_label]].forEach(([k,u,l])=>{if(u&&l&&z.code&&z.code!=='-'){const kk=key(l)+'|'+k;if(!m.has(kk))m.set(kk,{code:z.code,kind:k,url:u,label:l,k:key(l)})}}));LBL=[...m.values()];return LBL}
function matchC2(fn){const k=key(fn);return Object.values(C).some(c=>{const n=key(c.name);return n.length>2&&k.includes(n)})}
function matchL(fn){const k=key(String(fn).replace(/\.(xlsx|xls|csv)$/i,''));let b=null;(LBL||[]).forEach(x=>{const hit=k===x.k||k.includes(x.k)||(k.length>8&&x.k.includes(k));if(hit&&(!b||x.k.length>b.k.length))b=x});return b}
async function pickC(){const fs=$('uf').files;if(fs.length!==1){$('um').innerHTML=fs.length?fs.length+' files selected (a .zip is opened when you click Upload). Each file is matched to its company code from the master sheet link text.':'';return}
 try{await loadL()}catch(e){}const h=matchL(fs[0].name),m=h?h.code:matchC(fs[0].name);if(!m&&matchC2(fs[0].name)){$('um').innerHTML='This company has more than one code, and the file name does not say which. Pick the correct code in the list, then Upload.';return}if(m){$('uc').value=m;$('um').innerHTML='Company matched'+(h?' from the master sheet link ('+h.kind+')':' from the file name')+': <b>'+esc(cn2(m))+'</b>'}}
function upload(){let g=GSHEET_URL;try{g=g||localStorage.getItem('cdc_gs')||''}catch(e){}
 return `<div class="box"><h2>1. Placement students (Career Choice file)</h2><div class="row"><input type="file" id="sf" accept=".xlsx,.xls"><button class="b" onclick="impStudents()">Import</button></div><div class="m">Reads the sheet with "Roll No" and "Career Choice" and keeps only <b>Campus Placements</b> students. Everyone else is left out of the portal.</div><div id="sm" style="margin-top:8px"></div></div>
<div class="box"><h2>2. L&amp;D Master Sheet (companies, codes, CST/CSA schedule, Communication / Excel trainings)</h2><div class="row"><input type="file" id="mf" accept=".xlsx,.xls"><button class="b" onclick="impMasterFile()">Import file</button></div>
<div class="row"><input id="gsu2" size="46" placeholder="Apps Script web app URL (ends with /exec)"><input id="gsk2" size="16" placeholder="Secret key"><button class="b g" onclick="syncApps()">Sync master sheet + Drive files now</button></div>
<div class="row"><label class="m"><input type="checkbox" id="gauto" onchange="setAuto()"> Sync automatically every 15 minutes while this page is open and each time it is opened</label><span class="m" id="gls"></span></div>
<div class="row"><input id="gu" placeholder="Or paste the Google Sheet link" size="50" value="${esc(g)}"><button class="b g" onclick="syncG()">Sync from Google Sheet</button></div><div class="m">Companies are created from the "Training code" column (like 27CST012_CAS). Core / Non-core is kept as you set it in the Companies tab. For Google Sheet sync, share the sheet as "Anyone with the link: Viewer".</div><div id="gm" style="margin-top:8px"></div></div>
<div class="box"><h2>3. Attendance and assessment files</h2><div class="row"><select id="ut"><option value="CST">CST / CSA file (detected from file name and sheet names)</option><option value="COMM">Communication training</option><option value="EXCEL">Excel training</option><option value="DEL">Delisted list (Placement Office)</option><option value="PLC">Placed list (Placement Office)</option></select><select id="uc">${Object.keys(C).sort().map(c=>`<option value="${c}">${esc(cn2(c))}</option>`).join('')}</select><input type="file" id="uf" accept=".xlsx,.xls,.csv,.zip" multiple onchange="pickC()"><button class="b" onclick="doUp()">Upload</button></div>
<div class="row"><input id="gsu" size="46" placeholder="Apps Script web app URL (ends with /exec)"><input id="gsk" size="16" placeholder="Secret key"></div>

 else if(t==='PLC')await put('placed',[...PL.values()].filter(x=>have.has(x.roll)),{onConflict:'roll'});
 else{for(const k of new Set(rl.map(x=>x.kind))){if(base[cd+'|'+k]>0)continue;const{error}=await sb.from('records').delete().eq('kind',k).eq('code',cd);if(error)throw error}await put('records',rl,{onConflict:'roll,code,kind,ord'});base[cd+'|CST']=cnt.CST;base[cd+'|CSA']=cnt.CSA}
 const kinds=[...new Set(rl.map(x=>x.kind))].join(' + ')||t;
 o.innerHTML=`<span class="t P">Saved</span> <span class="m">${esc(f.name)}</span> ${cd==='-'?'':'<b>'+esc(cn2(cd))+'</b>: '}${kinds}, ${new Set(rl.map(x=>x.roll)).size} placement students, ${rl.length} entries.${skip?` ${skip} roll numbers in the file are not campus-placement students and were skipped.`:''}`;return true}
 catch(e){o.innerHTML=`<span class="t A">Failed</span> ${esc(f.name)}: ${esc(e.message||e)}`;return false}}
/* ---------- Users (admin) ---------- */
async function users(){const s=await all(()=>sb.from('staff').select('*').order('email'));return `<div class="box"><h2>Team access</h2><div class="row"><input id="ue" placeholder="Email" size="30"><select id="ur"><option value="viewer">Viewer (search and view only)</option><option value="admin">Admin (full control)</option></select><button class="b" onclick="addU()">Add / update</button></div><div class="m" style="margin-bottom:8px">This sets what each person can do. The login (email and password) itself is created in Supabase > Authentication > Users.</div><div class="tw"><table><tr><th>Email</th><th>Role</th><th></th></tr>${s.map(x=>`<tr><td>${esc(x.email)}</td><td>${x.role}</td><td>${x.email===EMAIL?'<span class="m">You</span>':`<button class="b g" onclick="delU('${esc(x.email)}')">Remove</button>`}</td></tr>`).join('')}</table></div></div>`}
async function addU(){const e=$('ue').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e)){alert('Enter a valid email.');return}const{error}=await sb.from('staff').upsert({email:e,role:$('ur').value});if(error)alert(error.message);draw()}
async function delU(e){if(!confirm('Remove access for '+e+'?'))return;const{error}=await sb.from('staff').delete().eq('email',e);if(error)alert(error.message);draw()}
/* ---------- Companies ---------- */
let selC='';
async function comp(){await loadC();const ss=selC?await all(()=>sb.from('sessions').select('*').eq('code',selC).order('id')):[],ot=await all(()=>sb.from('sessions').select('*').eq('code','-').order('id'));
 const lnk=(u,l)=>/^https?:\/\//i.test(u||'')?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`:'',lk=x=>{const L=x.links||{},n=(L.csa||[]).length;return[lnk(L.jd,'JD'),...(L.students||[]).map((z,i)=>lnk(z.u,'Students '+(i+1))),lnk(L.placed,'Placed list'),...(L.csa||[]).map((z,i)=>lnk(z.u,'CSA report'+(n>1?' '+(i+1):'')))].filter(Boolean).join('<br>')};
 const tb=(L,cs)=>`<div class="tw"><table><tr>${cs.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${L.map(x=>`<tr>${cs.map(c=>`<td>${c[2]?(c[1](x)||''):esc(c[1](x)??'')}</td>`).join('')}</tr>`).join('')||'<tr><td class="N">Nothing yet.</td></tr>'}</table></div>`;
 let h=`<div class="box"><h2>Companies</h2><div class="row"><input id="cc" placeholder="Code e.g. 27CST050_CAS" size="18"><input id="cnm" placeholder="Company name"><select id="ct"><option>Core</option><option>Non-core</option><option>Super Dream</option></select><button class="b" onclick="addC()">Add company</button></div>
 <div class="m" style="margin-bottom:8px">Set Core / Non-core / Super Dream for each company here. The master sheet does not carry it.</div><div class="tw"><table><tr><th>Code</th><th>Company</th><th>Type</th><th>Eligibility</th><th>Role</th><th>Drive</th><th>Interview rounds</th><th>Links</th><th></th></tr>`+
 Object.values(C).sort((a,b)=>a.code.localeCompare(b.code)).map(x=>`<tr class="${x.code===selC?'hl':''}"><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td><select onchange="setT('${esc(x.code)}',this.value)">${['Core','Non-core','Super Dream'].map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`).join('')}</select></td><td class="wrap">${esc(x.eligibility||'')}</td><td class="wrap">${esc(x.role||'')}</td><td>${esc([x.drive_type,x.drive_date].filter(Boolean).join(' '))}</td><td class="wrap">${esc((x.rounds||[]).join(' > '))}</td><td class="lk">${lk(x)}</td><td><button class="b g" onclick="selC='${esc(x.code)}';draw()">Sessions</button> <button class="b g" onclick="delC('${esc(x.code)}')">Remove</button></td></tr>`).join('')+`</table></div></div>`;
 if(selC)h+=`<div class="box"><h2>CST / CSA sessions - ${esc(cn2(selC))}</h2>`+tb(ss,[['Type',x=>x.kind],['Topic',x=>x.topic],['Date',x=>x.sdate],['Time',x=>x.stime],['Partner',x=>x.partner],['Trainer',x=>x.trainer],['Eligible',x=>x.eligible],['Attended',x=>x.attended],['Attendance sheet',x=>lnk(x.att_link,'Open'),1],['CSA report',x=>lnk(x.csa_link,'Open'),1]])+`</div>`;
 return h+`<div class="box"><h2>Communication, Excel and Resume trainings (by department)</h2>`+tb(ot,[['Department / class',x=>x.eligibility.slice(0,70)],['Topic',x=>x.topic],['Date',x=>x.sdate],['Time',x=>x.stime],['Trainer',x=>x.trainer],['Eligible',x=>x.eligible],['Attended',x=>x.attended]])+`</div>`}
async function setT(c,v){const{error}=await sb.from('companies').update({type:v}).eq('code',c);if(error)alert(error.message);else C[c].type=v}
async function delC(c){if(!confirm('Remove '+cn2(c)+' with all its CST/CSA records and sessions?'))return;for(const t of['records','sessions','rounds'])await sb.from(t).delete().eq('code',c);const{error}=await sb.from('companies').delete().eq('code',c);if(error)alert(error.message);if(selC===c)selC='';draw()}
async function addC(){const k=$('cc').value.trim().toUpperCase(),n=$('cnm').value.trim();if(!k||!n){alert('Enter code and name.');return}const{error}=await sb.from('companies').upsert({code:k,name:n,type:$('ct').value});if(error)alert(error.message);draw()}
init();
</script></body></html>
