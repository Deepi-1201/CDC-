async function ex(){const id=$('xi').value,r=$('xr').value.trim();if(!id||!r){alert('Pick an absence and enter a reason.');return}const{error}=await sb.from('records').update({exempt:r}).eq('id',id);if(error)alert(error.message);draw()}

async function report(){
 const codes=Object.keys(C).sort();if(!rc&&codes.length)rc=codes[0];const o=(v,l,c)=>`<option value="${v}" ${c===v?'selected':''}>${esc(l)}</option>`;

 const nm=Object.fromEntries(stu.map(x=>[x.roll,x.name])),ds=new Set(dl.map(x=>x.roll)),cols=[],seen={},cell={},rl=new Set();
 rs.forEach(x=>{const k=x.code+'|'+x.kind+'|'+x.ord;if(!seen[k]){seen[k]=1;cols.push({code:x.code,kind:x.kind,ord:x.ord,label:x.label,k})}cell[x.roll+'|'+k]=x;rl.add(x.roll)});

 let R=[...rl].sort();if(rf==='ABS')R=R.filter(r=>cols.some(c=>cell[r+'|'+c.k]?.status==='A'));M={cols,R,cell,nm};

/* ---------- Upload ---------- */
const nz=v=>String(v??'').replace(/\s+/g,' ').trim(),key=v=>nz(v).toLowerCase().replace(/[^a-z0-9]/g,''),w2r=(wb,n)=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false});

function pickC(){const f=$('uf').files[0],m=f?matchC(f.name):'';if(m){$('uc').value=m;$('um').innerHTML='Company matched from the file name: <b>'+esc(cn2(m))+'</b>'}}
function upload(){let g=GSHEET_URL;try{g=g||localStorage.getItem('cdc_gs')||''}catch(e){}
 return `<div class="box"><h2>1. Placement students (Career Choice file)</h2><div class="row"><input type="file" id="sf" accept=".xlsx,.xls"><button class="b" onclick="impStudents()">Import</button></div><div class="m">Reads the sheet with "Roll No" and "Career Choice" and keeps only <b>Campus Placements</b> students. Everyone else is left out of the portal.</div><div id="sm" style="margin-top:8px"></div></div>

async function impStudents(){const f=$('sf').files[0],o=$('sm');if(!f){o.textContent='Choose the Career Choice file first.';return}

async function impMaster(sh,o,LK){const fk=re=>Object.keys(sh).find(k=>re.test(k)),f=re=>{const k=fk(re);return k?sh[k]:null},md=f(/master data/i),m=md&&hdr(md),mk=fk(/master data/i);if(!m)throw new Error('Sheet "Master data" with the S. No header was not found.');
 const{H,R}=m,x={code:gi(H,'trainingcode'),nm:gi(H,'companyname'),el:gi(H,'eligibility'),ro:gi(H,'role'),dt:gi(H,'drivetype'),dd:gi(H,'drivedate'),kd:gi(H,'trainingassessmentcourse'),ty:gi(H,'trainingassessmenttype'),sd:gi(H,'trainingassessmentdate'),tm:gi(H,'sessiontiming'),pa:gi(H,'trainingassessmentpartner'),tr:gi(H,'trainername'),ne:gi(H,'noofeligiblestudents'),na:gi(H,'noofstudentsattendedmin12'),at:gi(H,'trainigattendancesheet'),cr:gi(H,'csareport')};

async function doUp(){
